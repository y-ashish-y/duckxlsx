<svg width="1000" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="duck-arch-title duck-arch-desc">
      <title id="duck-arch-title">duckxlsx system architecture</title>
      <desc id="duck-arch-desc">Architecture diagram showing Excel, LibreOffice Calc, and GridCraft flowing through native adapters and a shared mapping core into local DuckDB files.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (before arrows and nodes) -->
        <rect x="24" y="64" width="192" height="320" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="66" y="68" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="112" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">HOSTS</text>

        <rect x="264" y="64" width="232" height="320" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="332" y="68" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">ADAPTERS</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="200" y1="128" x2="280" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="200" y1="224" x2="280" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="200" y1="320" x2="280" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 480,128 H 520 Q 528,128 528,136 V 200 Q 528,208 536,208 H 560"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="224" x2="560" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,320 H 520 Q 528,320 528,312 V 248 Q 528,240 536,240 H 560"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="720" y1="224" x2="800" y2="224" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="216" y="204" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IMPORT</text>

        <rect x="216" y="232" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="241" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXPORT</text>

        <rect x="736" y="204" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="770" y="213" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL · FILES</text>

        <!-- Nodes: hosts -->
        <rect x="40" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="104" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="64" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="120" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Excel</text>
        <text x="120" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Desktop + Web</text>

        <rect x="40" y="192" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="192" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="200" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="64" y="209" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="120" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LibreOffice Calc</text>
        <text x="120" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flatpak 26.8</text>

        <rect x="40" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="48" y="296" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="64" y="305" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="120" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GridCraft</text>
        <text x="120" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLI 0.5.0</text>

        <!-- Nodes: adapters -->
        <rect x="280" y="96" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="96" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="288" y="104" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="308" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADAPT</text>
        <text x="380" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Office JS add-in</text>
        <text x="380" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">taskpane + WASM</text>

        <rect x="280" y="192" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="192" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="288" y="200" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="308" y="209" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADAPT</text>
        <text x="380" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Basic macro driver</text>
        <text x="380" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller + .xba</text>

        <rect x="280" y="288" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="288" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="288" y="296" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="308" y="305" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADAPT</text>
        <text x="380" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP bridge + CLI</text>
        <text x="380" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stdio JSON-RPC</text>

        <!-- Node: shared core -->
        <rect x="560" y="192" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="192" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="568" y="200" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="584" y="209" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="640" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shared mapping</text>
        <text x="640" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">import · export SQL</text>

        <!-- Node: store (focal) -->
        <rect x="800" y="192" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="192" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="808" y="200" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="820" y="209" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="880" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">local .duckdb</text>
        <text x="880" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one writer</text>

        <!-- Legend strip -->
        <line x1="40" y1="408" x2="960" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="444" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Data store</text>

        <rect x="180" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="444" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Host / adapter</text>

        <line x1="360" y1="442" x2="388" y2="442" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="396" y="444" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">SQL + file flow</text>

        <line x1="560" y1="442" x2="588" y2="442" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="596" y="444" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Import / export</text>
      </svg>
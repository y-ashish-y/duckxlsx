<svg width="1000" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="duck-dep-title duck-dep-desc">
      <title id="duck-dep-title">duckxlsx deployment</title>
      <desc id="duck-dep-desc">Deployment diagram showing the Excel webview sandbox, the LibreOffice flatpak, and host processes all on one machine, exchanging files and MCP calls with local DuckDB files.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (before arrows and nodes) -->
        <rect x="24" y="88" width="264" height="216" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="48" y="92" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="80" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">OFFICE</text>

        <rect x="312" y="88" width="264" height="216" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="336" y="92" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="370" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">FLATPAK</text>

        <rect x="600" y="88" width="376" height="280" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="624" y="92" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="648" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">HOST</text>

        <!-- Paths (behind boxes) -->
        <path d="M 156,136 V 72 H 876 V 136"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="552" y1="208" x2="800" y2="208" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="700" y1="240" x2="700" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="880" y1="240" x2="880" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Path labels -->
        <rect x="484" y="52" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="516" y="61" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE-PICK</text>

        <rect x="652" y="188" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="197" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TSV+INI</text>

        <rect x="708" y="226" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP:STDIO</text>

        <rect x="808" y="226" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="828" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>

        <!-- Node: Excel WebView -->
        <rect x="48" y="136" width="216" height="144" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="136" width="216" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="56" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="70" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="156" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Excel WebView</text>
        <rect x="60" y="196" width="192" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="68" y="212" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">taskpane dist/</text>
        <text x="244" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v1.0.0</text>
        <rect x="60" y="228" width="192" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="68" y="244" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">duckdb-wasm</text>
        <text x="244" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">1.33</text>

        <!-- Node: LibreOffice -->
        <rect x="336" y="136" width="216" height="144" rx="6" fill="#f5f5f5"/>
        <rect x="336" y="136" width="216" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="344" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="358" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="444" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LibreOffice 26.8</text>
        <rect x="348" y="196" width="192" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="356" y="212" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">user profile</text>
        <text x="532" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">DuckXlsx</text>
        <rect x="348" y="228" width="192" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="356" y="244" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">macro runner</text>
        <text x="532" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">headless</text>

        <!-- Node: gridcraft-cli -->
        <rect x="624" y="136" width="152" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="624" y="136" width="152" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="632" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="646" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BIN</text>
        <text x="700" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gridcraft-cli</text>
        <rect x="632" y="188" width="136" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="640" y="204" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">tarball</text>
        <text x="760" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0.5.0</text>

        <!-- Node: store (focal) -->
        <rect x="800" y="136" width="152" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="136" width="152" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="808" y="144" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="824" y="153" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
        <text x="876" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">.duckdb files</text>
        <rect x="808" y="188" width="136" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="816" y="204" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">single-writer</text>
        <text x="936" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">local</text>

        <!-- Node: sidecar -->
        <rect x="624" y="240" width="328" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="624" y="240" width="328" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="632" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="646" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="788" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">duckxlsx sidecar</text>
        <rect x="636" y="288" width="304" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="644" y="304" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">dist-cli/main.js</text>
        <text x="932" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v1.0.0</text>
        <rect x="636" y="320" width="304" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="644" y="336" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">imports.json</text>
        <text x="932" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">json</text>

        <!-- Legend strip -->
        <line x1="40" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="448" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="456" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Data file</text>

        <rect x="180" y="448" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="456" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Host process</text>

        <line x1="360" y1="454" x2="388" y2="454" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="396" y="456" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Cross-sandbox file flow</text>

        <line x1="620" y1="454" x2="648" y2="454" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="656" y="456" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Same-host call</text>
      </svg>